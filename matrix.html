<!doctype html>
<html lang="ja">
  <head>
    <title>LEDマトリクス</title>
    <link rel="icon" href="/chiba.png" />
    <meta charset="UTF-8" />
    <style>
      body,
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1;
        font-family: 'MisakiGothic', 'M+ 1p', 'MS Gothic', sans-serif;
        image-rendering: pixelated;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: none;
      }
      #canvas {
        background: black;
        color: white;
        width: 130px;
        height: 68px;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        padding: 2px 0;
      }
      .scroll_track {
        display: inline-block;
        position: absolute;
        left: 130px;
        top: 18px;
        color: #f3a600;
        white-space: nowrap;
      }
      .scroll_play_track {
        display: inline-block;
        position: absolute;
        left: 130px;
        top: 50px;
        color: #f3a600;
        white-space: nowrap;
      }
      .alert {
        position: fixed;
        left: 0;
        top: 34px;
        width: 130px;
        height: 34px;
        color: red;
        white-space: nowrap;
        background: black;
        align-self: baseline;
        display: flex;
        flex-direction: column;
        justify-content: center; /* 縦方向の中央揃え */
        align-items: center; /* 横方向の中央揃え（必要に応じて） */
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div style="display: flex; justify-content: space-between">
        <p>エノキ電気</p>
        <p id="clock" style="color: #11ca00">00:00</p>
      </div>
      <p class="scroll_track" id="scrollText">ニュース取得中…</p>
      <div style="height: 15px"></div>
      <p>ラジオ再生情報</p>
      <div style="height: 2px"></div>
      <p class="scroll_play_track" id="playingText">再生情報取得中…</p>
      <p class="alert" id="passTrain">電車が通過します</p>
    </div>

    <script>
      var CANVAS_WIDTH = 130

      // 汎用スクロール関数：要素ごとに独立した状態（位置、タイマー）をクロージャで保持する
      function initScroller(elementId, fetchCallback) {
        var el = document.getElementById(elementId)
        if (!el) return

        var currentX = CANVAS_WIDTH
        var intervalId = null

        function step() {
          var textWidth = el.offsetWidth
          currentX -= 1

          if (currentX < -textWidth) {
            currentX = CANVAS_WIDTH
            if (typeof fetchCallback === 'function') {
              fetchCallback(el)
            }
          }
          el.style.left = currentX + 'px'
        }

        // 初期データ取得
        if (typeof fetchCallback === 'function') {
          fetchCallback(el)
        }

        // 33ms周期でアニメーション実行
        intervalId = setInterval(step, 33)
      }

      // RSSニュース取得処理
      function fetchAndUpdateRss(track) {
        let unixTime = new Date().getTime()
        let xhr = new XMLHttpRequest()
        xhr.open('GET', '/getRss.php?t=' + unixTime, true)
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              let data = JSON.parse(xhr.responseText)
              if (data && data.channel && data.channel.item) {
                let titles = []
                for (let i = 0; i < data.channel.item.length; i++) {
                  titles.push(data.channel.item[i].title)
                }
                track.innerHTML = titles.join(' | ')
              }
            } catch (error) {
              track.innerHTML = 'RSS解析エラー'
            }
          }
        }
        xhr.send()
      }

      // 再生情報取得処理
      function fetchAndUpdatePlaying(track) {
        let unixTime = new Date().getTime()
        var xhr = new XMLHttpRequest()
        xhr.open('GET', '/getPlaying.php?t=' + unixTime, true)
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              let data = JSON.parse(xhr.responseText)
              let nowPlaying =
                '' +
                data.now_playing.song.artist +
                ' - ' +
                data.now_playing.song.title
              track.innerHTML = nowPlaying
            } catch (error) {
              track.innerHTML = 'Azuracast解析エラー'
            }
          }
        }
        xhr.send()
      }

      // 時計更新処理
      function updateClock() {
        var now = new Date()
        var hours = now.getHours()
        var minutes = now.getMinutes()

        if (hours < 10) hours = '0' + hours
        if (minutes < 10) minutes = '0' + minutes

        var clockEl = document.getElementById('clock')
        if (clockEl) {
          clockEl.innerHTML = hours + ':' + minutes
        }
      }

      window.onload = function () {
        // ニュースのスクロール初期化
        initScroller('scrollText', fetchAndUpdateRss)

        // 再生情報のスクロール初期化
        initScroller('playingText', fetchAndUpdatePlaying)

        // 時計更新
        setInterval(updateClock, 1000)
        updateClock()

        // アラートの点滅処理
        var alerts = document.querySelectorAll('.alert')

        // 古い環境では alerts.forEach が使えないため、通常の for ループを使用
        for (var i = 0; i < alerts.length; i++) {
          ;(function (alertElement) {
            // 1. 各要素が持っている元の文字色を取得して保存しておく
            var originalColor = alertElement.style.color || 'red' // スタイルが空ならデフォルト色を設定
            var visible = true

            // 500ミリ秒（0.5秒）ごとに文字色を切り替えるタイマー
            setInterval(function () {
              if (visible) {
                // 文字色を「透明」にする（背景色は残る）
                alertElement.style.color = 'transparent'
              } else {
                // 文字色を「元の色」に戻す
                alertElement.style.color = originalColor
              }
              visible = !visible
            }, 500)
          })(alerts[i])
        }

        function whileAlert() {
          var min = 1 * 60 * 1000
          var max = 10 * 60 * 1000
          var randomTime = Math.floor(Math.random() * (max - min + 1)) + min

          setTimeout(function () {
            const element = document.getElementById('passTrain')
            element.style.opacity = 1
            setTimeout(function () {
              element.style.opacity = 0
              whileAlert()
            }, 30 * 1000)
          }, randomTime)
        }
        whileAlert()
      }
    </script>
  </body>
</html>
